[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "quantum-sandbox-mcp"
version = "0.1.0"
description = "Quantum Computer Sandbox MCP server for AI agents (Qiskit Aer simulation only)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Quantum Sandbox" }]
dependencies = [
  "mcp>=2.0.0",
  "qiskit>=1.2.0",
  "qiskit-aer>=0.16.0",
  "qiskit-qasm3-import>=0.5.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[project.scripts]
quantum-sandbox-mcp = "quantum_sandbox_mcp.cli:main"
quantum-sandbox-api = "quantum_sandbox_mcp.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_sandbox_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
